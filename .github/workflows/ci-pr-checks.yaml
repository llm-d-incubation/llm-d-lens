name: CI - PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: true

jobs:
  english-content:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test English checker
        run: npm run test:english
      - name: Check repository and PR text
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          npm run check:english -- --text-file "$RUNNER_TEMP/pr-title.txt" --text-file "$RUNNER_TEMP/pr-body.md"

  # Detect if PR contains code changes (skip expensive checks for docs-only PRs)
  check-code-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event.action != 'edited'
    outputs:
      has_docs_changes: ${{ steps.filter.outputs.docs }}
      has_python_changes: ${{ steps.filter.outputs.python }}
      has_code_changes: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check for code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/site/**'
              - 'docs/design/agentic-deployment-design.md'
              - 'package*.json'
              - 'CONTRIBUTING.md'
              - '.github/workflows/ci-pr-checks.yaml'
              - 'tools/check-docs*'
            python:
              - 'apps/backend/**'
              - '.github/workflows/ci-pr-checks.yaml'
            code:
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              - 'scripts/**'
              - 'package*.json'
              - '*config*'
              - 'Makefile'
              - 'Dockerfile*'
              - 'docker/**'
              - '.github/workflows/**'

  # Release-time gate: the pinned llm-d stack must be internally consistent and
  # every referenced version must exist (llm_d_lens/versions/llm_d_stack.yaml).
  llm-d-stack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the stack checker
        run: npm run test:stack

      - name: Validate the pinned llm-d stack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:stack

  # Validate the actual frontend and Node API instead of the old Go placeholder.
  frontend-and-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Python for the MCP catalog
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate MCP catalog
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "apps/backend[embedded-db]"
          node scripts/generate-mcp-tools.mjs

      - name: Type check
        run: npm run type-check

      - name: Test
        run: make test-js
      - name: Test documentation checker
        run: npm run test:docs

  # Python: lint (only if Python files exist)
  python-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check for Python files
        id: check-python
        run: |
          if find . -name "*.py" -not -path "./.git/*" | head -1 | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        if: steps.check-python.outputs.has_python == 'true'
        run: pip install ruff

      - name: Run ruff check
        if: steps.check-python.outputs.has_python == 'true'
        run: ruff check .

      - name: Run ruff format check
        if: steps.check-python.outputs.has_python == 'true'
        run: ruff format --check .

  # Container: build (no push) to validate Dockerfile
  container-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag test-build:pr-${{ github.event.pull_request.number }} \
            .

  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_docs_changes == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Build bilingual documentation and validate links
        run: npm run docs:build

  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_python_changes == 'true'
    env:
      LENS_DATA_DIR: ${{ runner.temp }}/lens-tests/data
      LENS_CACHE_DIR: ${{ runner.temp }}/lens-tests/cache
      LENS_LOG_DIR: ${{ runner.temp }}/lens-tests/logs
      LENS_SCRATCH_DIR: ${{ runner.temp }}/lens-tests/scratch
      LLM_D_BENCH_DB_ALLOW_SQLITE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - name: Install test dependencies
        run: pip install -e 'apps/backend[dev,embedded-db]'
      - name: Run backend regression tests
        run: python -m pytest apps/backend/tests apps/backend/src/llm_d_lens -q
