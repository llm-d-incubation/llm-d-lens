# The model weights from a node-local cache, as llm-d's OpenShift overlays read them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: decode
      spec:
        template:
          spec:
            containers:
              - name: modelserver
                volumeMounts:
                  - mountPath: /model-cache
                    name: model-storage
                    readOnly: true
            volumes:
              - name: model-storage
                hostPath:
                  path: /var/model-cache
                  type: Directory
