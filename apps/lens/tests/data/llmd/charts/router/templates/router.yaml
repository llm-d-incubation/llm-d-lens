apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ .Release.Name }}-epp'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}-epp'
spec:
  replicas: {{.Values.router.epp.replicas}}
  selector:
    matchLabels:
      app: '{{ .Release.Name }}-epp'
  template:
    metadata:
      labels:
        app: '{{ .Release.Name }}-epp'
    spec:
      serviceAccountName: '{{ .Release.Name }}-epp'
      containers:
        - name: epp
          image: registry.example.invalid/epp:v1
          args:
            - --pool-name
            - '{{ .Release.Name }}'
            - --pool-namespace
            - '{{ .Release.Namespace }}'
            # {{- if not .Values.router.monitoring.prometheus.auth.enabled }}
            - --metrics-endpoint-auth=false
            # {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: '{{ .Release.Name }}-epp'
spec:
  selector:
    app: '{{ .Release.Name }}-epp'
  ports:
    - name: http
      port: 80
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: '{{ .Release.Name }}'
spec:
  endpointPickerRef:
    name: '{{ .Release.Name }}-epp'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: '{{ .Release.Name }}-epp'
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: '{{ .Release.Name }}-epp'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ .Release.Name }}-epp'
subjects:
  - kind: ServiceAccount
    name: '{{ .Release.Name }}-epp'
