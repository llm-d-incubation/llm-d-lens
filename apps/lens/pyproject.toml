[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The import name and command are `lens`; the PyPI name `lens` belongs to an
# unrelated project, so the distribution name differs until publishing is decided.
name = "llm-d-lens-engine"
version = "0.0.1"
description = "llm-d Lens engine and CLI"
requires-python = ">=3.11"
# Keep this list minimal: the engine must install without the server's stack
# (FastAPI, database, auth). See docs/design/repository-layout.md.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "pytest>=8",
]

[project.scripts]
lens = "lens.__main__:main"

[tool.setuptools.packages.find]
include = ["lens*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "RET", "SIM"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "S101", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
